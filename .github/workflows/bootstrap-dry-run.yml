name: Verify gh-plan Phase A bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-controller:
    # Manual bootstrap can only dispatch from the canonical trusted main ref.
    if: github.ref == 'refs/heads/main' && github.repository == 'attention-spa/gh-plan'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Prefer OCI for read-only bootstrap, fall back only before start
        run: node scripts/ci-fallback-controller.mjs
        env:
          BOOTSTRAP_FALLBACK_RUN: '1'
          GITHUB_TOKEN: ${{ github.token }}
