name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    # PR code never reaches the persistent OCI runner or an Actions-write token.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: git diff --exit-code -- package.json package-lock.json
      - run: npm run schema:check
      - run: npm run docs:check
      - run: npm test
      - run: npm run build
      - run: npm run test:dist
      - run: npm run test:consumer

  consumer-node24:
    # Small read-only compatibility proof on hosted PR and main.
    # Never run untrusted PR code on the persistent OCI worker.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: git diff --exit-code -- package.json package-lock.json
      - run: npm run build
      - run: npm run test:dist
      - run: npm run test:consumer

  main-controller:
    # Only trusted main pushes can dispatch/cancel a worker workflow.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prefer trusted OCI; fail over only before worker start
        run: node scripts/ci-fallback-controller.mjs
        env:
          CI_FALLBACK_RUN: '1'
          GITHUB_TOKEN: ${{ github.token }}
