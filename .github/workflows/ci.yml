name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    # PR code never reaches the persistent OCI runner or an Actions-write token.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      # Temporary, PR-hosted, unprivileged lockfile bootstrap. Remove in final diff.
      - name: Generate npm lockfile for checked-in deterministic CI
        run: |
          node -e 'const fs=require("node:fs");const x=fs.readFileSync("package-lock.json");console.log("GHPLAN203_LOCK_BEGIN");const s=x.toString("base64");for(let i=0;i<s.length;i+=120)console.log("GHPLAN203_B64 "+s.slice(i,i+120));console.log("GHPLAN203_LOCK_END");'
      - run: npm run schema:check
      - run: npm run docs:check
      - run: npm test
      - run: npm run build
      - run: npm run test:dist

  main-controller:
    # Only trusted main pushes can dispatch/cancel a worker workflow.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prefer trusted OCI; fail over only before worker start
        run: node scripts/ci-fallback-controller.mjs
        env:
          CI_FALLBACK_RUN: '1'
          GITHUB_TOKEN: ${{ github.token }}
