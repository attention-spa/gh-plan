name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    # Untrusted PR code stays on GitHub-hosted VMs; trusted main pushes use OCI.
    # Self-hosted routing has no automatic GitHub-hosted fallback (separate unit).
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","trusted"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run schema:check
      - run: npm run docs:check
      - run: npm test
      - run: npm run build
      - run: npm run test:dist
